name: veridma-ci

on:
  push:
  pull_request:

jobs:
  static-and-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog g++ python3 python3-yaml
      - name: Repository structure
        run: make structure-check
      - name: RTL lint
        run: make lint
      - name: Directed RTL smoke
        run: make rtl-smoke
      - name: C++ reference model
        run: make cpp-test
      - name: Regression tooling tests
        run: make script-test
      - name: Smoke profile planning
        run: python3 scripts/run_regression.py --profile smoke --dry-run

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Formal properties
        run: make formal
